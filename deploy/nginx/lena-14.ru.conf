# Landing: static files from /var/www/lena-14.ru, uploaded by GitHub Actions
# (.github/workflows/deploy.yml); www redirects to the bare domain.
# Installed once by hand as /etc/nginx/sites-available/lena-14.ru; deploys do not change it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lena-14.ru;
    include snippets/lena-14-ssl.conf;

    root /var/www/lena-14.ru;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Browsers ask for a fresh page on every visit: a new deploy shows up at once
        add_header Cache-Control "no-cache";
    }

    # File names in _astro/ change with their content: safe to cache for a year
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lena-14.ru;
    include snippets/lena-14-ssl.conf;

    return 301 https://lena-14.ru$request_uri;
}
